# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on an unregistered mark rather than silently skipping the guard.
addopts = "--strict-markers"
markers = [
    "allow_network: test may open real network connections (deselected in CI).",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.coverage.run]
source = ["src/jobhunter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# A ratchet, not a target: set just under the measured figure so a regression
# fails but an unrelated PR isn't blocked by rounding. 96% measured 2026-07-30,
# every module >=90%. Lowest are rss/snapshot at 90% and probe/rank at 92%.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Gradual typing: the floor is "no silent breakage", not strict mode. Tighten
# one flag at a time, then flip the CI types job off continue-on-error.
[tool.mypy]
python_version = "3.11"
files = ["src/jobhunter"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
