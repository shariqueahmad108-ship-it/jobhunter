# profile.example.yaml
# Copy this to `profile.yaml` and fill in the blanks. This file is the single knob that
# controls what the tool searches for, what it filters out, and how it ranks survivors.
# Everyday tuning happens HERE, not in code. Every value below is an illustrative
# placeholder — replace them with your own; nothing here is a recommended default.
# Validated against the schema in specs/03-data-model.md on load — typos fail loud.

identity:
  target_skills:                    # count toward the skill_match score component
    - "TypeScript"
    - "React"
    - "Node.js"
    - "AWS"
    - "system design"
  target:                           # one entry per track you would accept; scoring measures
    - track: "ic"                   #   distance from these on the listing's own track
      level: "senior"               # ic: intern|junior|mid|senior|staff|principal
    - track: "management"
      level: "manager"              # management: manager|senior_manager|director|vp

queries:                            # the ONLY source of search terms (titles go here too)
  keywords:
    - "senior software engineer"
    - "staff engineer"
    - "engineering manager"
    - "full stack"
  locations:
    - "Remote Australia"
    - "Remote"
  max_results_per_query: 50
  max_requests_per_run: 100         # hard cap; run truncates (and says so) rather than exceed

hard_requirements:                  # any failure => listing dropped; UNKNOWN data => kept & marked
  # --- Location policy ----------------------------------------------------
  # Filter on location only where the source data is reliable. Aggregators tag
  # roles by suburb or company HQ, so a strict location filter drops genuinely
  # remote roles — prefer a high location_fit weight below. See 02 §Stage 4.
  remote_policy: "remote_only"      # remote_only | hybrid_ok | onsite_ok | any (defined in 02 §Stage 4)
  exclude_locations:                # drop roles based in any of these, even if labelled remote
    - "Example City"                #   covers "remote, but must be local" postings
  locations_allowed: []             # [] = any location is fine PROVIDED remote_policy passes
                                    #      and the role is not in exclude_locations.
                                    #      Populate to positively restrict to certain places.
  seniority:                        # per-track bounds; delete a track to disallow it entirely
    ic:         { min: "mid", max: null }
    management: { min: "manager", max: "director" }
  salary_floor: 160000              # annualized comparison; null = no floor
  salary_currency: "AUD"            # ISO 4217; your comparison currency
  fx_rates:                         # OPTIONAL overrides of the global fx_rates.yaml, INTO
    USD: 1.50                       #   salary_currency. A currency with no rate anywhere
    NZD: 0.93                       #   makes that salary "unknown" (kept, not dropped).
  keep_unknown_salary: true         # keep listings with no (comparable) salary
  exclude_employment:               # employment types to drop; unknown employment is kept
    - "internship"
  exclude_keywords:                 # word-boundary, case-insensitive, scoped deal-breakers
    - { term: "unpaid",             scope: "requirements" }   # requirements = title + description
    - { term: "security clearance", scope: "requirements" }
    - { term: "PHP",                scope: "title" }          # title-only: a passing mention is fine
  max_age_days: 21

preferences:                        # soft signals that influence ranking, not filtering
  preferred_locations:              # keep these consistent with exclude_locations above —
    - "Remote Australia"            #   a preference for a hard-excluded place never applies
  salary_target: 200000
  preferred_companies:
    - "Atlassian"
    - "Canva"
  deprioritize_keywords:            # soft counterpart to exclude_keywords: titles matching
    - "sales"                       #   these sink on skill_match instead of being dropped.
    - "recruiter"                   #   Use for domains usually wrong but occasionally right.
  # industry / company-size preferences: cut from v1 (no source provides the data) —
  # see specs/04-technical-plan.md §Decisions

weights:                            # relative importance; 0 disables a component.
  skill_match: 30                   # NOTE: score = 100 × Σ(w·sub)/Σ(w) over ACTIVE weights,
  seniority_fit: 20                 #   so zeroing one rescales the rest — recheck
  compensation: 20                  #   output.display_threshold after weight changes.
  location_fit: 15
  company_signal: 10
  recency: 5

sources:                            # unified source activation — a source absent
                                    #   or enabled=false is never fetched.
                                    # The defaults below need NO credentials, so a fresh
                                    # copy of this file produces a real digest on first run.
  remoteok: { enabled: true }       # remote-only board, no key
  remotive:                         # remote-only board, no key. Omit `categories` for all.
    enabled: true
    categories: ["software-dev"]
  ats_watchlist:                    # company boards (greenhouse|lever|ashby|workday), no key.
    - { ats: "greenhouse", slug: "mozilla",       name: "Mozilla" }
    - { ats: "greenhouse", slug: "wikimedia",     name: "Wikimedia Foundation" }
    - { ats: "greenhouse", slug: "sourcegraph91", name: "Sourcegraph" }
                                    #   Slugs are exact and can carry digits — find yours
                                    #   with `jobhunter probe <careers-url>`; re-check the
                                    #   whole list any time with `jobhunter probe --check`.
  feeds:                            # any public RSS/Atom job feed
    - { name: "weworkremotely", url: "https://weworkremotely.com/remote-jobs.rss",
        company_from_title: true, region_location: true }
                                    #   Optional per-feed parsing flags (both default off):
                                    #   company_from_title (feed packs "Company: Title" into
                                    #   one element) and region_location (scope lives in
                                    #   <region>).
  # --- Keyed sources: uncomment once the env vars are set. Enabling one WITHOUT
  # --- its credentials just prints a warning and contributes nothing.
  # adzuna: { enabled: true }       # needs ADZUNA_APP_ID + ADZUNA_APP_KEY (free)
  # jooble: { enabled: true }       # needs JOOBLE_API_KEY (free)

search_mode: "active_employed"      # active_unemployed | active_employed | passive_employed
                                    # posture preset (see specs/02) — sets defaults for
                                    # display_threshold, max_shown and max_age_days; any
                                    # explicit value in this file overrides the preset

output:
  display_threshold: 55             # hide scored results below this (0-100)
  max_shown: 25                     # cap on the "New this run" section
  show_previously_seen: true        # keep prior shortlists reviewable in a second section
  format: "both"                    # markdown | html | both
  keep_raw: true                    # persist the pre-filter snapshot `jobhunter replay`
                                    #   re-scores offline (specs/05 §5.2)
